# Gaststätten in der Nähe
# ========================
# Hier tragt ihr die Gaststätten ein, die auf der Karte erscheinen sollen - nur die, die für
# euch relevant sind, nicht automatisch alle aus der Umgebung. Für jede wird täglich geprüft,
# ob sie heute laut OpenStreetMap geöffnet hat oder Ruhetag ist.
#
# Diese Datei kann auch bequem über die Seite erfassen.html gepflegt werden.
#
# WICHTIG:
#   - Nicht jede Gaststätte hat bei OpenStreetMap hinterlegte Öffnungszeiten, und wo doch, sind
#     sie nicht immer aktuell. Steht auf der Karte "Öffnungszeiten unbekannt", tragt sie hier
#     unten von Hand nach.
#   - Ein Eintrag mit einem Fehler wird übersprungen (mit Warnung im Ablauf-Protokoll bei GitHub
#     Actions), der Rest der Karte funktioniert trotzdem weiter.

