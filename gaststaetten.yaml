# Gaststätten in der Nähe
# ========================
# Hier tragt ihr die Gaststätten ein, die auf der Karte erscheinen sollen - nur die, die für
# euch relevant sind, nicht automatisch alle aus der Umgebung. Für jede wird täglich geprüft,
# ob sie heute geöffnet hat oder Ruhetag ist.
#
# Diese Datei wird am bequemsten über die Seite erfassen.html gepflegt (dort auch Speichern).
#
# Felder je Gaststätte:
#   name      Anzeigename auf der Karte
#   osm_id    feste Verknüpfung mit einem OpenStreetMap-Objekt (z. B. "node/123456") - am genauesten
#   osm_name  sonst: Suche bei OpenStreetMap nach diesem Namen
#   punkt     sonst: Koordinate von Hand [Breite, Länge]
#   zeiten    Öffnungszeiten von Hand je Wochentag, haben Vorrang vor OpenStreetMap
#             ("11:00-20:00", geteilt "11:00-14:00, 17:00-22:00" oder "Ruhetag")
#   hinweis   freier Zusatztext
#
# Ein Eintrag mit einem Fehler wird übersprungen (Warnung im Ablauf-Protokoll bei GitHub Actions),
# der Rest der Karte funktioniert trotzdem weiter.

gaststaetten:
