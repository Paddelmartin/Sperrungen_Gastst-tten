# Kartenpositionen der LBV-Sperrungen
# ===================================
# Hier steht, WO eine Sperrung von der LBV-Seite auf der Karte eingezeichnet wird.
# Am bequemsten über die Seite gewaesser.html pflegen (Karte zum Anklicken, Speichern direkt bei GitHub).
#
# Eine Regel passt, wenn 'match' im Feld "Gewässer" der LBV-Seite vorkommt UND 'bereich' (falls
# angegeben) im Feld "Bereich". Die ERSTE passende Regel gewinnt - spezielle Regeln also nach oben.
#
#   manual      von Hand eingezeichnet, hat Vorrang vor OpenStreetMap:
#                 - point: [Breite, Länge] mit radius_m   -> Kreis um eine Stelle
#                 - line:  [[Breite, Länge], ...]         -> Linie entlang eines Abschnitts
#   ways        sonst: Wasserwege dieses Namens aus OpenStreetMap
#   ways_regex  Rückfall-Suchmuster für andere Schreibweisen in OpenStreetMap
#   near        nur den Teil in der Nähe dieses Orts zeigen (mit radius_m)
#   genau       false -> im Popup steht "Abschnitt nur ungefähr eingezeichnet"
#   notiz       nur für euch, erscheint nicht auf der Karte
#
# Offen: Conradsbrücke (Spree, Brücke 08/78, Burg, Schwarze Ecke 1) - Position fehlt noch.

regeln:
  - match: "spree"
    bereich: "Conradsbrücke"
    manual:
      - point: [51.843472, 14.103381]
        radius_m: 50

  - match: "spree / brücke conrads"
    notiz: "Spree / Brücke Conrads"
    manual:
      - point: [51.843464, 14.10339]
        radius_m: 50

  - match: "zeitzfließ"
    bereich: "Zeitzschleuse"
    notiz: "Zeitzschleuse, Wehr 107"
    manual:
      - point: [51.870281, 13.995952]
        radius_m: 200

  - match: "stilles fließ"
    bereich: "Fischpass"
    notiz: "Kanu-Fischpass, Wehr 31"
    manual:
      - point: [51.860809, 14.090642]
        radius_m: 150

  - match: "großes fließ"
    bereich: "Wehr 116"
    notiz: "zweite Brücke unterhalb Wehr 116"
