  - match: "nordfließ"
    bereich: "Kannom"
    notiz: "Schleuse Kannomühle, Wehr 52"
    manual:
      - point: [51.893568, 14.055556]
        radius_m: 200

  - match: "neu lübbenauer kahnfahrt"
    bereich: "Neu Lübbenau"
    notiz: "Schleuse Neu Lübbenau"
    manual:
      - point: [52.07568, 13.885826]
        radius_m: 200

  - match: "burg-lübbener-kanal"
    bereich: "Kalkofen"
    notiz: "Kalkofenschleuse, Wehr 119"
    manual:
      - point: [51.886174, 13.968035]
        radius_m: 200

  - match: "spree"
    bereich: "Brückenjoch"
    notiz: "rechtes Brückenjoch, Eisenbahnbrücke Hartmannsdorf"
